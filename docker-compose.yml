# One-command local demo:  docker compose up --build   →  http://localhost:3000
# Requires a root .env with POSTGRES_PASSWORD and JWT_SECRET (see .env.example).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: raahsetu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: raahsetu
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raahsetu"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://raahsetu:${POSTGRES_PASSWORD}@db:5432/raahsetu?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ORIGIN: http://localhost:3000
      PUBLIC_APP_URL: http://localhost:3000
      SEED_DEMO: ${SEED_DEMO:-true}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:5000
        NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-true}
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
  uploads:
